[package]
name = "hanzi-notebook"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
anyhow = "1"
askama = "0.16"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["fs"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }